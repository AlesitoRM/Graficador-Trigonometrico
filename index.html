<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador Trigonométrico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <h2>Panel de Control</h2>
        
        <div class="grupo-control">
            <label>Función a Rastrear:</label>
            <select id="selectorFuncion">
                <option value="Seno">Seno</option>
                <option value="Coseno">Coseno</option>
                <option value="Tangente">Tangente</option>
                <option value="MayorEntero">⌊sen(θ)⌋</option>
            </select>
        </div>
        
        <div class="grupo-control">
            <label>Frecuencia:</label>
            <input type="number" id="inputFrecuencia" value="1" min="0.5" max="10" step="0.5">
        </div>

        <div class="grupo-control">
            <label>Desfase (°):</label>
            <input type="number" id="inputDesfase" value="0" step="15">
        </div>

        <div class="grupo-control">
            <label>Motor de Simulación:</label>
            <button id="btnAnimacion">Iniciar Animación</button>
        </div>

        <div class="grupo-control">
            <label>Marcar:</label>
            <input type="number" id="inputGrados" value="45">
            <button id="btnMarcar" class="btn-marcar">Aceptar</button>
        </div>
    </aside>

    <main class="visualizador">
        <div class="contenedor-paneles">
            <canvas id="canvasCirculo" width="320" height="320"></canvas>
            <canvas id="canvasOnda" width="680" height="320"></canvas>
        </div>
    </main>

    <script src="js/estado.js"></script>
    <script src="js/logica.js"></script>
    <script src="js/renderizador.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
